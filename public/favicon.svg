<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#7C3AED" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Canvas Squircle -->
  <rect width="64" height="64" rx="18" fill="#060913"/>
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="url(#bgGrad)" stroke-width="2"/>
  
  <!-- Gamepad icon -->
  <g filter="url(#glow)">
    <!-- Controller Body -->
    <path d="M18 24C14 24 10 27 10 32C10 37 13 46 17 48C20 49.5 24 45 26 41H38C40 45 44 49.5 47 48C51 46 54 37 54 32C54 27 50 24 46 24H18Z" fill="url(#bgGrad)"/>
    
    <!-- D-Pad -->
    <rect x="18" y="30" width="8" height="3" rx="1.5" fill="#ffffff"/>
    <rect x="20.5" y="27.5" width="3" height="8" rx="1.5" fill="#ffffff"/>
    
    <!-- Action Buttons -->
    <circle cx="43" cy="29" r="2" fill="#F59E0B"/>
    <circle cx="46.5" cy="32.5" r="2" fill="#10B981"/>
    <circle cx="39.5" cy="32.5" r="2" fill="#3B82F6"/>
    <circle cx="43" cy="36" r="2" fill="#EF4444"/>
    
    <!-- Center screen / power -->
    <circle cx="32" cy="33" r="2.5" fill="#ffffff" fill-opacity="0.8"/>
  </g>
</svg>
